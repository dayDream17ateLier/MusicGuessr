<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 估歌派對 MusicGuessr</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        /* 1. 全局字體與動態漸變背景大升級 */
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1e26 0%, #0d0d11 100%);
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        /* 2. 懸浮磨砂玻璃貨架 + 強化版霓虹外發光邊框 */
        :root {
            --tg-rgb: 177, 66, 255; /* 預設動態 RGB 顏色變數 */
        }
        .container {
            max-width: 450px;
            margin: 20px auto;
            background: rgba(25, 25, 30, 0.75); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 30px;
            border-radius: 24px;
            /* 💡 大幅強化外發光霓虹燈效果 */
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 
                        0 0 45px rgba(var(--tg-rgb), 0.5), 
                        0 0 90px rgba(var(--tg-rgb), 0.2);
            position: relative;
            z-index: 10;
            transition: box-shadow 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        #main-title { transition: 0.3s; margin-top: 0; font-size: 28px; }
        
        /* 動態主題文字顏色 */
        .color-anime { color: #ff4500 !important; }
        .color-jpop { color: #00d2ff !important; }
        .color-canto { color: #ffb703 !important; }
        .color-tw { color: #ff9800 !important; } 
        .color-kpop { color: #ff007f !important; }
        .color-meme { color: #8a2be2 !important; }
        .color-survival { color: #ff4d4d !important; }
        .color-mixed { color: #b142ff !important; } 

        /* 3. 「分區摺疊」手風琴機制樣式 */
        .accordion-item { 
            border-radius: 14px; 
            margin-bottom: 10px; 
            overflow: hidden; 
            background: rgba(0, 0, 0, 0.2); 
            border: 1px solid rgba(255,255,255,0.03);
        }
        .accordion-header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px 16px; 
            background: rgba(255,255,255,0.02); 
            cursor: pointer; 
            user-select: none;
            font-weight: 600; 
            font-size: 14px; 
            color: #ccc;
            transition: background 0.2s, color 0.2s;
        }
        .accordion-header:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .accordion-header .material-icons-round { transition: transform 0.3s; font-size: 20px; color: #777; }
        .accordion-content { 
            max-height: 0; 
            padding: 0 12px; 
            overflow: hidden; 
            transition: max-height 0.3s cubic-bezier(0, 1, 0, 1), padding 0.3s ease; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
        }
        .accordion-item.active { border-color: rgba(255,255,255,0.08); }
        .accordion-item.active .accordion-content { max-height: 500px; padding: 14px 12px; }
        .accordion-item.active .accordion-header { background: rgba(255,255,255,0.04); color: #fff; }
        .accordion-item.active .accordion-header .material-icons-round { transform: rotate(180deg); }

        /* 4. 雲朵流體排版標籤 + 底部滾動漸變淡出遮罩 */
        .category-wrapper {
            position: relative;
            background: #16161a;
            border-radius: 16px;
            padding: 10px;
            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }
        .category-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
            padding-bottom: 25px; 
            padding-right: 2px;
        }
        
        .category-grid::-webkit-scrollbar { width: 5px; }
        .category-grid::-webkit-scrollbar-track { background: transparent; }
        .category-grid::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        .category-grid::-webkit-scrollbar-thumb:hover { background: #666; }

        /* 「雲朵流體」膠囊標籤 */
        .category-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            color: #fff;
            user-select: none;
            flex: 1 1 auto; 
            width: max-content;
            text-align: center;
            opacity: 0.45; 
        }
        .category-label input { display: none; } 
        .category-label:hover { transform: translateY(-1.5px); opacity: 0.75; border-color: rgba(255,255,255,0.2); }

        .cat-meme:has(input:checked) { opacity: 1; border-color: #8a2be2; background: linear-gradient(145deg, rgba(138, 43, 226, 0.22), rgba(138, 43, 226, 0.05)); box-shadow: 0 0 10px rgba(138, 43, 226, 0.25); }
        .cat-anime:has(input:checked) { opacity: 1; border-color: #ff4500; background: linear-gradient(145deg, rgba(255, 69, 0, 0.22), rgba(255, 69, 0, 0.05)); box-shadow: 0 0 10px rgba(255, 69, 0, 0.25); }
        .cat-jpop:has(input:checked) { opacity: 1; border-color: #00d2ff; background: linear-gradient(145deg, rgba(0, 210, 255, 0.22), rgba(0, 210, 255, 0.05)); box-shadow: 0 0 10px rgba(0, 210, 255, 0.25); }
        .cat-canto:has(input:checked) { opacity: 1; border-color: #ffb703; background: linear-gradient(145deg, rgba(255, 183, 3, 0.22), rgba(255, 183, 3, 0.05)); box-shadow: 0 0 10px rgba(255, 183, 3, 0.25); }
        .cat-tw:has(input:checked) { opacity: 1; border-color: #ff9800; background: linear-gradient(145deg, rgba(255, 152, 0, 0.22), rgba(255, 152, 0, 0.05)); box-shadow: 0 0 10px rgba(255, 152, 0, 0.25); }
        .cat-kpop:has(input:checked) { opacity: 1; border-color: #ff007f; background: linear-gradient(145deg, rgba(255, 0, 127, 0.22), rgba(255, 0, 127, 0.05)); box-shadow: 0 0 10px rgba(255, 0, 127, 0.25); }

        /* 5. 模式與題數：橫排 Tab Buttons 粒粒設計 */
        .tab-container { display: flex; gap: 5px; background: #141417; padding: 4px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.03); }
        .tab-btn {
            flex: 1; padding: 10px 6px; background: transparent; border: none; color: #666;
            font-size: 13px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .tab-btn .material-icons-round { font-size: 17px; }
        .tab-btn:hover:not(.active) { color: #bbb; background: rgba(255,255,255,0.02); }
        
        /* 💡 模式同題數按鈕選中時，自動注入當前曲風對應主題色與霓虹脈衝效果 */
        .tab-btn.active { 
            background: linear-gradient(135deg, rgba(var(--tg-rgb), 0.35), rgba(var(--tg-rgb), 0.1)); 
            color: white !important; 
            border: 1px solid rgba(var(--tg-rgb), 0.7);
            box-shadow: 0 4px 15px rgba(var(--tg-rgb), 0.35);
            text-shadow: 0 0 5px rgba(var(--tg-rgb), 0.5);
        }

        /* 6. 大堂基礎佈局與設定面板 */
        .setup-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(40, 40, 45, 0.4);
            padding: 16px;
            border-radius: 14px;
            text-align: left;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .setup-group label { font-weight: 700; color: #ddd; font-size: 14px; }
        .setup-group input {
            padding: 12px;
            font-size: 15px;
            border-radius: 10px;
            border: 1px solid #444;
            background-color: #141417;
            color: white;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .setup-group input:focus { border-color: #666; }

        /* 7. 遊戲進行畫面樣式 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            margin-bottom: 10px;
            color: #aaa;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .turn-indicator {
            font-size: 20px;
            color: #fff;
            font-weight: bold;
            margin-bottom: 5px;
            background-color: #333;
            padding: 10px;
            border-radius: 10px;
        }
        .combo-text {
            font-size: 18px;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 15px;
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .question-text { font-size: 18px; margin-bottom: 15px; font-weight: bold; line-height: 1.5; min-height: 60px; }
        
        /* 倒數計時條 */
        .timer-container {
            width: 100%;
            height: 12px;
            background-color: #333;
            border-radius: 10px;
            margin: 15px 0 25px 0;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .timer-bar {
            height: 100%;
            width: 100%;
            background-color: #4CAF50; 
            border-radius: 10px;
            transition: width 0.1s linear, background-color 0.3s;
        }
        .audio-player { width: 100%; margin-bottom: 20px; }

        /* 8. 救命錦囊機制 UI */
        .lifeline-box {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .lifeline-btn {
            background-color: #444;
            border: 1px solid #666;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            flex-grow: 1;
        }
        .lifeline-btn:hover:not(:disabled) { background-color: #666; }
        .lifeline-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: #333; }
        #token-display {
            font-size: 14px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 15px;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }
        #lifeline-result {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: left;
            line-height: 1.4;
        }

        /* 9. 四個選項按鈕 */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .option-btn {
            background: linear-gradient(145deg, #24242a, #2f2f36);
            color: white;
            border: 1px solid rgba(255,255,255,0.06);
            padding: 16px 12px;
            font-size: 14px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            word-wrap: break-word;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .option-btn:hover:not(:disabled) { 
            transform: translateY(-2.5px); 
            box-shadow: 0 8px 16px rgba(0,0,0,0.5); 
            border-color: rgba(255,255,255,0.2);
            background: linear-gradient(145deg, #2f2f36, #383840);
        }
        .option-btn:active:not(:disabled) { transform: translateY(0.5px); }
        
        /* 動態回饋動畫：Shake & Pulse */
        .shake-anim { animation: shakeEffect 0.4s ease-in-out; }
        @keyframes shakeEffect {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .pulse-anim { animation: pulseEffect 0.6s cubic-bezier(0.165, 0.84, 0.44, 1); }
        @keyframes pulseEffect {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.8); transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { box-shadow: 0 0 0 15px rgba(76, 175, 80, 0); transform: scale(1); }
        }
        .btn-correct { background: #4CAF50 !important; border-color: #4CAF50 !important; box-shadow: 0 4px 15px rgba(76,175,80,0.4) !important; }
        .btn-wrong { background: #ff4d4d !important; border-color: #ff4d4d !important; box-shadow: 0 4px 15px rgba(255,77,77,0.4) !important; }
        
        /* 10. 底部連結、主按鈕、排行榜 */
        .apple-music-link-btn {
            background-color: #fa243c;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(250, 36, 60, 0.3);
        }
        .apple-music-link-btn:hover { background-color: #d11d31; transform: translateY(-1px); }
        
        #start-btn { 
            opacity: 0.4; 
            pointer-events: none; 
            transform: scale(0.98); 
            background: #2a2a30; 
            color: #666; 
            border: 1px solid #3a3a42;
            box-shadow: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        #start-btn.charged { 
            opacity: 1; 
            pointer-events: auto; 
            transform: scale(1); 
            border: 1px solid rgba(255,255,255,0.1);
        }
        .primary-btn {
            background-color: #fff;
            border: none;
            font-size: 19px;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 800;
            width: 100%;
            margin-top: 10px;
            color: #121212;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn-secondary { background-color: #444; color: #ddd; border: 1px solid #555; }
        .btn-secondary:hover { background-color: #555; color: #fff; transform: translateY(-1px); }

        #loading-msg { color: #ffeb3b; font-size: 14px; margin-bottom: 10px; font-weight: 600; }
        .leaderboard { text-align: left; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 14px; margin-top: 20px; border: 1px solid rgba(255,255,255,0.03); }
        .leaderboard-item { font-size: 18px; padding: 12px 0; border-bottom: 1px solid #2a2a30; display: flex; justify-content: space-between; font-weight: 600; }
        .leaderboard-item:last-child { border-bottom: none; }

        .lang-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            color: #ccc;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            z-index: 100;
        }
        .lang-toggle:hover { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.3); }
        .icon-align { display: inline-flex; align-items: center; vertical-align: middle; gap: 4px; }
    </style>
</head>
<body>

<div class="container">
    <button class="lang-toggle" id="lang-toggle-btn" onclick="toggleLang()">EN</button>
    <h1 id="main-title" class="color-jpop"><span id="app-title-text">估歌派對 MusicGuessr</span></h1>

    <div id="start-screen">
        <div class="setup-group">
            <label><span class="icon-align"><i class="material-icons-round color-canto">library_music</i> <span data-i18n="labelCategory">選擇專屬曲庫</span></span></label>
            <div class="category-wrapper">
                <div class="category-grid">
                    
                    <div class="accordion-item active">
                        <div class="accordion-header" onclick="toggleAccordion(this)"><span>特色綜合</span><i class="material-icons-round">expand_more</i></div>
                        <div class="accordion-content">
                            <label class="category-label cat-meme"><input type="checkbox" class="cat-checkbox" value="meme" onchange="updateTheme()"> <span data-i18n="catMeme">迷因大挑戰</span></label>
                            <label class="category-label cat-anime"><input type="checkbox" class="cat-checkbox" value="anime" onchange="updateTheme()"> <span data-i18n="catAnime">動漫專區 (80-26)</span></label>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <div class="accordion-header" onclick="toggleAccordion(this)"><span>🇭🇰 香港流行 (Canto-Pop)</span><i class="material-icons-round">expand_more</i></div>
                        <div class="accordion-content">
                            <label class="category-label cat-canto"><input type="checkbox" class="cat-checkbox" value="canto80" onchange="updateTheme()"> 80s (80-89)</label>
                            <label class="category-label cat-canto"><input type="checkbox" class="cat-checkbox" value="canto90" onchange="updateTheme()"> 90s (90-99)</label>
                            <label class="category-label cat-canto"><input type="checkbox" class="cat-checkbox" value="canto00" onchange="updateTheme()"> 00s (00-09)</label>
                            <label class="category-label cat-canto"><input type="checkbox" class="cat-checkbox" value="canto10" onchange="updateTheme()"> 10s (10-19)</label>
                            <label class="category-label cat-canto"><input type="checkbox" class="cat-checkbox" value="canto20" onchange="updateTheme()"> 20s (20-26)</label>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <div class="accordion-header" onclick="toggleAccordion(this)"><span>🇹🇼 台灣流行 (TW-Pop)</span><i class="material-icons-round">expand_more</i></div>
                        <div class="accordion-content">
                            <label class="category-label cat-tw"><input type="checkbox" class="cat-checkbox" value="tw00" onchange="updateTheme()"> 00s (00-09)</label>
                            <label class="category-label cat-tw"><input type="checkbox" class="cat-checkbox" value="tw10" onchange="updateTheme()"> 10s (10-19)</label>
                            <label class="category-label cat-tw"><input type="checkbox" class="cat-checkbox" value="tw20" onchange="updateTheme()"> 20s (20-26)</label>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <div class="accordion-header" onclick="toggleAccordion(this)"><span>🇯🇵 日本流行 (J-Pop)</span><i class="material-icons-round">expand_more</i></div>
                        <div class="accordion-content">
                            <label class="category-label cat-jpop"><input type="checkbox" class="cat-checkbox" value="jpop00" onchange="updateTheme()"> 00s (00-09)</label>
                            <label class="category-label cat-jpop"><input type="checkbox" class="cat-checkbox" value="jpop10" onchange="updateTheme()"> 10s (10-19)</label>
                            <label class="category-label cat-jpop"><input type="checkbox" class="cat-checkbox" value="jpop20" onchange="updateTheme()"> 20s (20-26)</label>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <div class="accordion-header" onclick="toggleAccordion(this)"><span>🇰🇷 韓國流行 (K-Pop)</span><i class="material-icons-round">expand_more</i></div>
                        <div class="accordion-content">
                            <label class="category-label cat-kpop"><input type="checkbox" class="cat-checkbox" value="kpop00" onchange="updateTheme()"> 00s (00-09)</label>
                            <label class="category-label cat-kpop"><input type="checkbox" class="cat-checkbox" value="kpop10" onchange="updateTheme()"> 10s (10-19)</label>
                            <label class="category-label cat-kpop"><input type="checkbox" class="cat-checkbox" value="kpop20" onchange="updateTheme()"> 20s (20-26)</label>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="setup-group">
            <label><span class="icon-align"><i class="material-icons-round color-jpop">videogame_asset</i> <span data-i18n="labelMode">選擇遊玩模式</span></span></label>
            <div class="tab-container" id="mode-tabs">
                <button class="tab-btn active" data-value="solo" onclick="selectTab('mode', this)"><i class="material-icons-round">person</i><span data-i18n="modeSolo">單人模式</span></button>
                <button class="tab-btn" data-value="party" onclick="selectTab('mode', this)"><i class="material-icons-round">groups</i><span data-i18n="modeParty">多人模式</span></button>
                <button class="tab-btn" data-value="survival" onclick="selectTab('mode', this)"><i class="material-icons-round">local_fire_department</i><span data-i18n="modeSurvival">生存模式</span></button>
            </div>
        </div>
        
        <div class="setup-group" id="round-group">
            <label><span class="icon-align"><i class="material-icons-round color-anime">hourglass_top</i> <span data-i18n="labelRounds">選擇題數 / 回合數</span></span></label>
            <div class="tab-container" id="round-tabs">
                <button class="tab-btn" data-value="3" onclick="selectTab('round', this)"><span data-i18n="rounds3">3 回合</span></button>
                <button class="tab-btn active" data-value="5" onclick="selectTab('round', this)"><span data-i18n="rounds5">5 回合</span></button>
                <button class="tab-btn" data-value="10" onclick="selectTab('round', this)"><span data-i18n="rounds10">10 回合</span></button>
            </div>
        </div>
        
        <div class="setup-group hidden" id="party-inputs">
            <label data-i18n="labelPlayerNames">輸入玩家名字</label>
            <input type="text" id="p1-name" data-i18n-placeholder="placeholderP1" placeholder="玩家 1 名字" value="玩家 A">
            <input type="text" id="p2-name" data-i18n-placeholder="placeholderP2" placeholder="玩家 2 名字" value="玩家 B">
            <input type="text" id="p3-name" data-i18n-placeholder="placeholderP3" placeholder="玩家 3 名字 (可留空)">
            <input type="text" id="p4-name" placeholder="玩家 4 名字 (可留空)">
        </div>
        <button id="start-btn" class="primary-btn" onclick="startGame()" data-i18n="btnStart">開始遊戲</button>
    </div>

    let activeMode = 'solo';
    let activeRounds = 5;

    function selectTab(type, btn) {
        const container = btn.parentElement;
        container.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        if (type === 'mode') {
            activeMode = btn.getAttribute('data-value');
            const partyInputs = document.getElementById('party-inputs');
            const roundGroup = document.getElementById('round-group');
            if (activeMode === 'party') {
                partyInputs.classList.remove('hidden');
                roundGroup.classList.remove('hidden');
            } else if (activeMode === 'survival') {
                partyInputs.classList.add('hidden');
                roundGroup.classList.add('hidden');
            } else {
                partyInputs.classList.add('hidden');
                roundGroup.classList.remove('hidden');
            }
        } else if (type === 'round') {
            activeRounds = parseInt(btn.getAttribute('data-value'));
        }
        updateTheme();
    }

    function updateTheme() {
        const checkboxes = document.querySelectorAll('.cat-checkbox:checked');
        selectedCategories = Array.from(checkboxes).map(cb => cb.value);
        const mode = activeMode; // 讀取橫排按鈕狀態

            document.documentElement.style.setProperty('--tg-rgb', '255, 77, 77');

        } else {
            title.className = 'color-mixed';
            currentThemeColor = "#b142ff";
            document.documentElement.style.setProperty('--tg-rgb', '177, 66, 255');
        }

        // 2. 「智能充能」按鈕漸變色彩算法
        if (selectedCategories.length === 0) {
            startBtn.classList.remove('charged');
            startBtn.style.background = "#2a2a30";
            startBtn.style.color = "#666";
        } else {
            startBtn.classList.add('charged');
            if (selectedCategories.length === 1) {
                startBtn.style.background = currentThemeColor;
            } else {
                const color1 = musicDatabase[selectedCategories[0]].themeColor;
                const color2 = musicDatabase[selectedCategories[1]].themeColor;
                startBtn.style.background = `linear-gradient(135deg, ${color1}, ${color2})`;
            }
            startBtn.style.color = mode === 'survival' ? "white" : "#121212";
        }
        
        if (replayBtn) replayBtn.style.backgroundColor = currentThemeColor;
    }

    function toggleModeUI() {
        const mode = document.getElementById('mode-select').value;
        const partyInputs = document.getElementById('party-inputs');
        const roundGroup = document.getElementById('round-group');
        
        if (mode === 'party') {
            partyInputs.classList.remove('hidden');
            roundGroup.classList.remove('hidden');
        } else if (mode === 'survival') {
            partyInputs.classList.add('hidden');
            roundGroup.classList.add('hidden'); 
        } else {
            partyInputs.classList.add('hidden');
            roundGroup.classList.remove('hidden');
        }
        updateTheme();
    }

    function startGame() {
        const checkboxes = document.querySelectorAll('.cat-checkbox:checked');
        selectedCategories = Array.from(checkboxes).map(cb => cb.value);
        
        if (selectedCategories.length === 0) {
            alert(currentLang === 'zh' ? "最少要選擇一個題庫先可以開始啊！" : "Please select at least one category!");
            return;
        }

        const musicPlayer = document.getElementById("music-player");
        musicPlayer.volume = 0.3; 

        const mode = activeMode; // 改為讀取 Tab 按鈕數值
        isSurvivalDead = false;

        document.getElementById("next-btn").style.backgroundColor = currentThemeColor;
        document.getElementById("next-btn").style.color = mode === 'survival' ? "white" : "#121212";
        document.getElementById("next-btn").className = 'primary-btn hidden';

        let initialTokens = 0;
        let playRounds = mode === 'survival' ? Infinity : activeRounds; // 改為讀取 Tab 按鈕數值
        if (mode === 'survival' || playRounds === 5) {
            initialTokens = 2;
        } else if (playRounds >= 10) {
            initialTokens = 3;
        } 
        
        if (mode === 'survival') {
            maxRounds = Infinity; 
            players = [{ name: t('defaultSurvivalName'), score: 0, combo: 0, tokens: initialTokens }];
        } else if (mode === 'solo') {
            maxRounds = playRounds;
            players = [{ name: t('defaultSoloName'), score: 0, combo: 0, tokens: initialTokens }];
        } else {
            maxRounds = playRounds;
            const names = [
                document.getElementById('p1-name').value.trim(),
                document.getElementById('p2-name').value.trim(),
                document.getElementById('p3-name').value.trim(),
                document.getElementById('p4-name').value.trim()
            ];
            names.forEach(name => { if (name !== "") players.push({ name: name, score: 0, combo: 0, tokens: initialTokens }); });

            if (players.length < 2) { alert(t('alertNeedTwoPlayers')); players = []; return; }
        }
    
        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        if (mode === 'party') document.getElementById("turn-indicator").classList.remove("hidden");
        
        playRound();
    }

    function restartSameSettings() {
        currentPlayerIndex = 0;
        currentRound = 1;
        isSurvivalDead = false;

        players.forEach(player => {
            player.score = 0;
            player.combo = 0;
            player.aiUsed = false;
            player.timeUsed = false;
        });

        document.getElementById("end-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        
        playRound();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function cleanTrackName(name) {
        return name.split(' (')[0].split(' -')[0].split('【')[0].trim();
    }

    async function fetchTracksForThisQuestion(artistObj, config) {
        const url = `https://itunes.apple.com/search?term=${encodeURIComponent(artistObj.search)}&country=${config.country}&media=music&entity=song&limit=100&lang=zh_hk`;
        try {
            const response = await fetch(url);
            const data = await response.json();
            let uniqueTracks = [];
            let seenNames = new Set();

            data.results.forEach(track => {
                if (track.previewUrl && track.releaseDate) {
                    const releaseYear = new Date(track.releaseDate).getFullYear();
                    if (releaseYear >= config.minYear && releaseYear <= config.maxYear) {
                        let cleanName = cleanTrackName(track.trackName);
                        if (!seenNames.has(cleanName.toLowerCase())) {
                            seenNames.add(cleanName.toLowerCase());
                            track.cleanName = cleanName; 
                            uniqueTracks.push(track);
                        }
                    }
                }
            });
            return uniqueTracks;
        } catch (error) { return []; }
    }

    function startTimer() {
        clearInterval(timerInterval);
        if (!isSkipping) { timeSpent = 0; }
        isSkipping = false; 

        document.getElementById("timer-container").classList.remove("hidden");
        const timerBar = document.getElementById("timer-bar");
        timerBar.style.width = "100%";
        timerBar.style.backgroundColor = "#4CAF50"; 

        timerInterval = setInterval(() => {
            timeSpent += 0.1;
            let timeLeft = roundMaxTime - timeSpent;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerBar.style.width = "0%";
                document.getElementById("music-player").pause();
            } else {
                let percentage = (timeLeft / roundMaxTime) * 100;
                timerBar.style.width = percentage + "%";
                
                if (timeSpent <= 10) {
                    timerBar.style.backgroundColor = "#4CAF50"; 
                } else if (timeSpent <= 15) {
                    timerBar.style.backgroundColor = "#ff9800"; 
                } else {
                    timerBar.style.backgroundColor = "#ff4d4d"; 
                }
            }
        }, 100);
    }

    function useAiLifeline() {
        if (aiUsedThisRound) return;
        aiUsedThisRound = true;
        
        const aiBtn = document.getElementById("lifeline-ai-btn");
        aiBtn.disabled = true;
        aiBtn.innerText = currentLang === 'zh' ? "⏳ 運算中..." : "⏳ Calculating..."; 
        
        setTimeout(() => {
            aiBtn.innerText = currentLang === 'zh' ? "🤖 已分析" : "🤖 Analyzed";
            const visibleBtns = Array.from(document.querySelectorAll(".option-btn:not(.hidden)"));
            if (visibleBtns.length === 0) return;

            let resultHTML = `🤖 <b>${t('aiAnalysis')}</b><br>`;
            
            if (visibleBtns.length === 2) {
                let p1 = Math.floor(Math.random() * 40) + 30; 
                let p2 = 100 - p1;
                resultHTML += `【${visibleBtns[0].innerText}】: <b>${p1}%</b><br>`;
                resultHTML += `【${visibleBtns[1].innerText}】: <b>${p2}%</b><br>`;
            } else {
                let r1 = Math.random() * 35 + 5, r2 = Math.random() * 35 + 5;
                let r3 = Math.random() * 35 + 5, r4 = Math.random() * 35 + 5;
                let sum = r1 + r2 + r3 + r4;
                let p1 = Math.round((r1/sum)*100), p2 = Math.round((r2/sum)*100);
                let p3 = Math.round((r3/sum)*100), p4 = 100 - (p1 + p2 + p3); 
                resultHTML += `【${visibleBtns[0].innerText}】: <b>${p1}%</b><br>`;
                resultHTML += `【${visibleBtns[1].innerText}】: <b>${p2}%</b><br>`;
                resultHTML += `【${visibleBtns[2].innerText}】: <b>${p3}%</b><br>`;
                resultHTML += `【${visibleBtns[3].innerText}】: <b>${p4}%</b>`;
            }

            const infoDiv = document.getElementById("lifeline-result");
            infoDiv.innerHTML = resultHTML;
            infoDiv.classList.remove("hidden");
        }, 2500);
    }

    function use5050Lifeline() {
        const p = players[currentPlayerIndex];
        if (p.tokens <= 0 || fiftyFiftyUsedThisRound) return;
        
        p.tokens--;
        fiftyFiftyUsedThisRound = true;
        document.getElementById("token-display").innerText = `🪙 錦囊代幣: ${p.tokens} / 3`;
        document.getElementById("lifeline-5050-btn").disabled = true;

        const allBtns = Array.from(document.querySelectorAll(".option-btn"));
        const wrongBtns = allBtns.filter(btn => btn.dataset.isCorrect === "false");
        const shuffledWrong = shuffleArray(wrongBtns);
        
        shuffledWrong[0].classList.add("hidden");
        shuffledWrong[1].classList.add("hidden");
    }

    function useTimeLifeline() {
        const p = players[currentPlayerIndex];
        if (p.tokens <= 0 || timeUsedThisRound) return;
        
        p.tokens--;
        timeUsedThisRound = true;
        document.getElementById("token-display").innerText = `🪙 錦囊代幣: ${p.tokens} / 3`;
        document.getElementById("lifeline-time-btn").disabled = true;
        
        roundMaxTime = 30; 
        isExtendedTime = true;

        const musicPlayer = document.getElementById("music-player");
        if (musicPlayer.paused && timeSpent >= 20 && timeSpent < 30) {
            musicPlayer.play().catch(()=>{});
            startTimer();
            timeSpent = 20; 
        }
    }

    function useSkipLifeline() {
        const p = players[currentPlayerIndex];
        if (p.tokens <= 0) return;
        
        p.tokens--;
        isSkipping = true; 
        document.getElementById("music-player").pause();
        
        playRound();
    }

    async function playRound() {
        const currentPlayer = players[currentPlayerIndex];
        const mode = document.getElementById('mode-select').value;
        
        // ✨ 【核心修正】: 回合剛開始，依照當前語系，動態同步刷新「進度題數Bar」與「分數Bar」
        if (mode === 'survival') {
            document.getElementById("round-counter").textContent = t('survivalLabel', currentRound);
        } else {
            document.getElementById("round-counter").textContent = t('progressLabel', currentRound, maxRounds);
        }
        document.getElementById("score-display").textContent = t('scoreLabel', currentPlayer.score);

        if (!isSkipping) {
            roundMaxTime = 20;
            isExtendedTime = false;
        }
        
        aiUsedThisRound = false;
        fiftyFiftyUsedThisRound = false;
        timeUsedThisRound = false;

        const tokenDisplay = document.getElementById("token-display");
        if (maxRounds === 3 && mode !== 'survival') {
            tokenDisplay.classList.add("hidden"); 
        } else {
            tokenDisplay.innerText = `🪙 錦囊代幣: ${currentPlayer.tokens} / 3`;
            tokenDisplay.classList.remove("hidden");
        }

        document.getElementById("lifeline-ai-btn").disabled = false;
        document.getElementById("lifeline-ai-btn").innerText = t('btnAI') || "🤖 問 AI";
        
        let outOfTokens = currentPlayer.tokens <= 0;
        document.getElementById("lifeline-5050-btn").disabled = outOfTokens;
        document.getElementById("lifeline-time-btn").disabled = outOfTokens || isExtendedTime;
        document.getElementById("lifeline-skip-btn").disabled = outOfTokens;
        document.getElementById("lifeline-result").classList.add("hidden");
    
        const comboDiv = document.getElementById("combo-display");
        if (currentPlayer.combo >= 2) {
            let fireIcon = currentPlayer.combo >= 3 ? '🔥' : '✨';
            comboDiv.innerText = t('comboActive', currentPlayer.combo, fireIcon);
            comboDiv.classList.remove("hidden");
        } else {
            comboDiv.classList.add("hidden");
        }
        
        document.getElementById("next-btn").classList.add("hidden");
        document.getElementById("timer-container").classList.add("hidden");
        document.getElementById("apple-link-container").classList.add("hidden");

        const optionsContainer = document.getElementById("options");
        optionsContainer.innerHTML = "";
        
        const musicPlayer = document.getElementById("music-player");
        const loadingMsg = document.getElementById("loading-msg");
        const questionText = document.getElementById("question-text");
        
        musicPlayer.pause();
        musicPlayer.src = "";
        clearInterval(timerInterval); 
        
        loadingMsg.classList.remove("hidden");
        musicPlayer.classList.add("hidden");
        questionText.innerText = t('loadingMsg');

        const randomCatKey = selectedCategories[Math.floor(Math.random() * selectedCategories.length)];
        const dbConfig = musicDatabase[randomCatKey];
        const isSongMode = !!dbConfig.hitSongs; 
        const currentPool = isSongMode ? dbConfig.hitSongs : dbConfig.artists;

        let randomItem = currentPool[Math.floor(Math.random() * currentPool.length)];
        let tracks = await fetchTracksForThisQuestion(randomItem, dbConfig);

        if (tracks.length > 0) {
            retryCount = 0;
            let selectedOptions = [];
            let correctTrackData = null;
            let correctIdForCheck = null;

            if (isSongMode) {
                correctTrackData = tracks[0];
                correctIdForCheck = randomItem.search; 
                
                let otherOptions = shuffleArray(currentPool.filter(item => item.search !== randomItem.search)).slice(0, 3);
                selectedOptions = shuffleArray([randomItem, ...otherOptions]);

                loadingMsg.classList.add("hidden");
                questionText.innerText = t('questionSong');

            } else {
                if (tracks.length < 4) {
                    retryCount++;
                    if (retryCount > 3) { alert(t('alertServerBusy')); location.reload(); return; }
                    playRound(); return;
                }
                
                tracks = shuffleArray(tracks);
                selectedOptions = tracks.slice(0, 4); 
                let correctIndex = Math.floor(Math.random() * 4);
                correctTrackData = selectedOptions[correctIndex];
                correctIdForCheck = correctTrackData.trackId;

                loadingMsg.classList.add("hidden");
                questionText.innerText = t('questionArtist', randomItem.display);
            }

            selectedOptions.forEach(opt => {
                let btn = document.createElement("button");
                let currentBtnId = isSongMode ? opt.search : opt.trackId; 
                
                btn.innerText = isSongMode ? opt.display : opt.cleanName; 
                btn.className = "option-btn";
                btn.dataset.id = currentBtnId;
                btn.dataset.isCorrect = (currentBtnId === correctIdForCheck) ? "true" : "false"; 
                
                btn.onclick = function() { checkAnswer(this, currentBtnId, correctIdForCheck, selectedOptions, currentPlayer, correctTrackData, isSongMode) };
                optionsContainer.appendChild(btn);
            });

            musicPlayer.src = correctTrackData.previewUrl;
            musicPlayer.classList.remove("hidden");
            
            musicPlayer.play().then(() => {
                startTimer();
            }).catch(()=> {
                musicPlayer.onplay = () => { startTimer(); musicPlayer.onplay = null; };
            });

        } else {
            retryCount++;
            if (retryCount > 3) {
                alert(t('alertServerBusy2'));
                location.reload();
                return;
            }
            playRound(); 
        }
    }

    function checkAnswer(clickedBtn, selectedId, correctId, optionList, currentPlayer, correctTrackData, isSongMode) {
        const allBtns = document.querySelectorAll(".option-btn");
        const musicPlayer = document.getElementById("music-player");
        const questionText = document.getElementById("question-text");
        const comboDiv = document.getElementById("combo-display");
        const mode = document.getElementById('mode-select').value;
        
        clearInterval(timerInterval); 
        allBtns.forEach(btn => btn.disabled = true);
        musicPlayer.pause(); 

        document.getElementById("lifeline-ai-btn").disabled = true;
        document.getElementById("lifeline-5050-btn").disabled = true;
        document.getElementById("lifeline-time-btn").disabled = true;
        document.getElementById("lifeline-skip-btn").disabled = true;

        if (selectedId === correctId) {
            clickedBtn.classList.add("pulse-anim", "btn-correct");
            currentPlayer.combo++; 

            if (mode === 'survival' && currentPlayer.combo > 0 && currentPlayer.combo % 5 === 0) {
                if (currentPlayer.tokens < 3) {
                    currentPlayer.tokens++;
                    questionText.innerHTML += currentLang === 'zh' ? `<span style="color:#4CAF50; font-size: 14px;">🎁 生存 5 連勝！獲得 1 個代幣！</span><br>` : `<span style="color:#4CAF50; font-size: 14px;">🎁 5 Streak! Gained 1 Token!</span><br>`;
                } else {
                    questionText.innerHTML += currentLang === 'zh' ? `<span style="color:#aaa; font-size: 14px;">🎒 滿 5 連勝，但代幣已達上限 (3個)！</span><br>` : `<span style="color:#aaa; font-size: 14px;">🎒 5 Streak, but tokens are maxed out (3)!</span><br>`;
                }
            }
            
            let basePoints = 0;
            let speedMsg = "";

            if (timeSpent <= 3) {
                basePoints = 15;
                speedMsg = `<span style="color:#ffb703;">${t('msgInstakill')}</span>`;
            } else if (timeSpent <= 5) {
                basePoints = 11;
                speedMsg = `<span style="color:#4CAF50;">${t('msgSpeed')}</span>`;
            } else if (timeSpent <= 20) {
                basePoints = 10;
                speedMsg = `<span style="color:#aaa;">${t('msgCorrect')}</span>`;
            } else if (timeSpent > 20 && isExtendedTime) {
                basePoints = 10;
                speedMsg = `<span style="color:#00d2ff;">${t('msgExtended')}</span>`;
            } else {
                basePoints = 5;
                speedMsg = `<span style="color:#ff4d4d;">${t('msgTimeout')}</span>`;
            }

            let comboBonus = 0;
            let comboMsg = "";
            if (currentPlayer.combo >= 2) {
                comboBonus = currentPlayer.combo;
                let fireIcon = currentPlayer.combo >= 3 ? "🔥" : "✨";
                comboMsg = ` <span style="color:#ff9800;">| ${t('msgCombo', currentPlayer.combo, comboBonus)}</span>`;
                comboDiv.innerText = t('comboAchieved', currentPlayer.combo, fireIcon);
                comboDiv.classList.remove("hidden");
            }

            currentPlayer.score += (basePoints + comboBonus);
            
            // ✨ 【修正2】: 分數變更時同步套用 i18n 翻譯，防範英文版跳出中文「分數」
            document.getElementById("score-display").textContent = t('scoreLabel', currentPlayer.score);
            questionText.innerHTML += `<br>${speedMsg}${comboMsg}`;

        } else {
            currentPlayer.combo = 0; 
            clickedBtn.classList.add("shake-anim", "btn-wrong");
            
            if (mode === 'survival') {
                isSurvivalDead = true;
                questionText.innerHTML += `<br><span style="color:#ff4d4d;">${t('msgSurvivalDead')}</span>`;
            } else {
                questionText.innerHTML += `<br><span style="color:#ff4d4d;">${t('msgWrong')}</span>`;
            }
            comboDiv.classList.add("hidden"); 
            
            allBtns.forEach((btn, index) => {
                let currentBtnId = isSongMode ? optionList[index].search : optionList[index].trackId;
                if (currentBtnId === correctId) {
                    btn.classList.add("btn-correct");
                }
            });
        }

        if (correctTrackData && correctTrackData.trackViewUrl) {
            document.getElementById("apple-music-btn").href = correctTrackData.trackViewUrl;
            document.getElementById("apple-link-container").classList.remove("hidden");
        }

        let isLastPlayer = (currentPlayerIndex === players.length - 1);
        let isLastRound = (currentRound === maxRounds);
        let nextBtn = document.getElementById("next-btn");
        
        if (mode === 'survival' && isSurvivalDead) {
            nextBtn.innerText = t('nextSurvivalEnd');
        } else if (isLastPlayer && isLastRound) {
            nextBtn.innerText = t('nextResults');
        } else if (isLastPlayer) {
            nextBtn.innerText = mode === 'solo' || mode === 'survival' ? t('nextQuestion') : t('nextRound');
        } else {
            nextBtn.innerText = t('nextPass', players[currentPlayerIndex + 1].name);
        }
        
        nextBtn.classList.remove("hidden");
    }

    function nextTurn() {
        const mode = document.getElementById('mode-select').value;
        if (mode === 'survival' && isSurvivalDead) {
            endGame();
            return;
        }

        currentPlayerIndex++;
        
        if (currentPlayerIndex >= players.length) {
            currentPlayerIndex = 0;
            currentRound++;
        }

        if (currentRound > maxRounds) {
            endGame();
        } else {
            playRound();
        }
    }

    function triggerConfetti() {
        var duration = 3000;
        var end = Date.now() + duration;

        (function frame() {
            confetti({
                particleCount: 5, angle: 60, spread: 55, origin: { x: 0 },
                colors: [currentThemeColor, '#ffffff', '#4CAF50']
            });
            confetti({
                particleCount: 5, angle: 120, spread: 55, origin: { x: 1 },
                colors: [currentThemeColor, '#ffffff', '#4CAF50']
            });
            if (Date.now() < end) { requestAnimationFrame(frame); }
        }());
    }

    function endGame() {
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("end-screen").classList.remove("hidden");
        const mode = document.getElementById('mode-select').value;
        
        triggerConfetti();

        const leaderboardDiv = document.getElementById("leaderboard");
        const endTitle = document.getElementById("end-title");
        leaderboardDiv.innerHTML = "";
        
        if (mode === 'survival') {
            endTitle.innerText = t('endTitleSurvival');
            endTitle.style.color = "#ff4d4d";
            let p = players[0];
            let item = document.createElement("div");
            item.className = "leaderboard-item";
            item.innerHTML = `<span>${t('survivalResult', currentRound - 1)}</span> <span>${t('pointsLabel', p.score)}</span>`;
            leaderboardDiv.appendChild(item);
        } else {
            endTitle.innerText = t('endTitleNormal');
            endTitle.style.color = "#4CAF50";
            let sortedPlayers = [...players].sort((a, b) => b.score - a.score);
            let medals = ["🥇", "🥈", "🥉", "👏"];
            sortedPlayers.forEach((player, index) => {
                let item = document.createElement("div");
                item.className = "leaderboard-item";
                let rankSymbol = mode === 'solo' ? "🌟" : (medals[index] || "👏");
                item.innerHTML = `<span>${rankSymbol} ${player.name}</span> <span>${t('pointsLabel', player.score)}</span>`;
                leaderboardDiv.appendChild(item);
            });
        }
    }
</script>
